{% extends 'base_dashboard.html' %}
{% block content %}
<div class="container mt-4">
  <h2>{% if form.instance.pk %}Edit Book{% else %}Register Book{% endif %}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'books:book_table' %}" class="btn btn-secondary">Back to Table</a>
  </form>
</div>
{% endblock %}
