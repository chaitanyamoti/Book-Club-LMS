{% extends 'base_dashboard.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Notifications Dashboard</h2>
  <form method="post" action="{% url 'notifications:send_welcome' %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Send Welcome Email (to me)</button>
  </form>
  {% if request.user.is_staff %}
  <form method="post" action="{% url 'notifications:send_overdue' %}" class="mt-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-warning">Send Overdue Alerts (to all overdue users)</button>
  </form>
  {% endif %}
  {% if messages %}
    <ul class="mt-3">
      {% for message in messages %}
        <li class="alert alert-{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</div>
{% endblock %}
