<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block subject %}{% endblock %}</title>
    <style>
        /* Inline CSS for email client compatibility */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background: white; }
        .header { background: #007bff; color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .content { padding: 20px; }
        .content h2 { color: #333; margin-top: 0; }
        .content p { line-height: 1.6; color: #555; }
        .footer { background: #f8f9fa; padding: 20px; text-align: center; font-size: 12px; color: #6c757d; }
        .button { display: inline-block; padding: 12px 24px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .button:hover { background: #0056b3; }
        .highlight { background: #e3f2fd; padding: 15px; border-left: 4px solid #007bff; margin: 15px 0; }
        .book-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .book-title { font-weight: bold; color: #333; }
        .book-author { color: #666; font-style: italic; }
        .qr-code { text-align: center; margin: 15px 0; }
        .stats { background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 15px 0; }
        .stats-item { display: inline-block; margin: 0 10px; text-align: center; }
        .stats-number { font-size: 24px; font-weight: bold; color: #007bff; }
        .stats-label { font-size: 12px; color: #666; text-transform: uppercase; }
        /* Responsive styles */
        @media only screen and (max-width: 600px) {
            .container { width: 100% !important; }
            .content { padding: 10px !important; }
            .header { padding: 15px !important; }
            .footer { padding: 15px !important; }
            .button { display: block; width: 100%; box-sizing: border-box; }
            .stats-item { display: block; margin: 10px 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{% block header %}📚 Book Club{% endblock %}</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            {% block footer %}
            <p>You're receiving this email because you're a member of our Book Club.</p>
            <p>
                <a href="{% block unsubscribe_url %}#{% endblock %}">Unsubscribe</a> |
                <a href="{% block preferences_url %}#{% endblock %}">Email Preferences</a>
            </p>
            <p>© 2024 Book Club Manager. All rights reserved.</p>
            {% endblock %}
        </div>
    </div>
    <!-- Tracking pixel for open rate monitoring -->
    <img src="{% block tracking_pixel %}{% endblock %}" width="1" height="1" style="display:none;" alt="">
</body>
</html>
