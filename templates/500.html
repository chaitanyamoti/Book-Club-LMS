{% extends 'base.html' %}
{% load static %}

{% block title %}Server Error - Book Club{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow">
                <div class="card-body py-5">
                    <i class="fas fa-exclamation-circle fa-4x text-danger mb-4"></i>
                    <h1 class="display-4 text-muted">500</h1>
                    <h2 class="h4 mb-3">Server Error</h2>
                    <p class="text-muted mb-4">
                        Something went wrong on our end. We're working to fix this issue.
                    </p>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="{% url 'core:dashboard' %}" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>Go to Dashboard
                        </a>
                        <button onclick="window.location.reload()" class="btn btn-outline-secondary">
                            <i class="fas fa-refresh me-2"></i>Try Again
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
